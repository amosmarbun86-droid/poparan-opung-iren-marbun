<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    "
  >

  <title>
    🌳 Poparan Opung Iren Marbun
  </title>

  <!-- STYLE -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- D3 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- HTML2CANVAS -->
  <script src="
https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js
"></script>

  <!-- JSPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body class="logged-out">



<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <h2 id="authTitle">🔒 Masuk</h2>

    <div id="loginForm">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
      >

      <button id="loginBtn">
        Masuk
      </button>

      <p id="loginError" class="login-error"></p>

      <p class="login-switch">
        Anggota baru? <a id="showRegisterLink" href="#">Daftar dengan token</a>
      </p>

    </div>

    <div id="registerForm" class="hidden-form">

      <input
        id="registerEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="registerToken"
        type="text"
        placeholder="Token dari admin"
      >

      <button id="registerBtn">
        Daftar
      </button>

      <p id="registerError" class="login-error"></p>

      <p class="login-switch">
        Sudah punya akun? <a id="showLoginLink" href="#">Masuk</a>
      </p>

    </div>

  </div>

</div>



<!-- =========================
     HEADER
========================= -->

<header class="app-shell">

  <h1>
    🌳 Poparan Opung Iren Marbun
  </h1>

  <p>
    Sistem Pohon Silsilah Keluarga
  </p>

  <button id="themeToggleBtn" class="theme-btn">
    ☀️ Mode Terang
  </button>

  <button id="logoutBtn" class="theme-btn">
    🚪 Keluar
  </button>

</header>



<!-- =========================
     MAIN CONTAINER
========================= -->

<div class="container app-shell">



  <!-- =========================
       SIDEBAR FORM
  ========================= -->

  <aside class="form-box">

    <h3>
      Tambah Anggota
    </h3>



    <!-- SEARCH -->

    <input
      type="text"
      id="search"
      placeholder="🔍 Cari anggota..."
    >



    <!-- NAME -->

    <input
      id="name"
      placeholder="Nama Lengkap"
    >



    <!-- BIRTH -->

    <input
      id="birth"
      type="date"
    >



    <!-- DEATH -->

    <label class="field-label">
      Tanggal Meninggal (jika sudah tiada)
    </label>

    <input
      id="death"
      type="date"
    >



    <!-- PHOTO -->

    <input
      id="photo"
      type="file"
      accept="image/*"
    >



    <!-- FATHER -->

    <select id="father">

      <option value="">
        -- Pilih Ayah --
      </option>

    </select>



    <!-- MOTHER -->

    <select id="mother">

      <option value="">
        -- Pilih Ibu --
      </option>

    </select>



    <!-- SPOUSE -->

    <select id="spouse">

      <option value="">
        -- Pilih Pasangan --
      </option>

    </select>



    <!-- GENDER -->

    <select id="gender">

      <option value="">
        -- Jenis Kelamin --
      </option>

      <option value="male">
        ♂ Laki-laki
      </option>

      <option value="female">
        ♀ Perempuan
      </option>

    </select>



    <!-- BUTTON -->

    <button id="addBtn">

      ➕ Tambah Anggota

    </button>



    <button id="saveImageBtn">

      📸 Simpan Gambar

    </button>

    <button id="exportPdfBtn">

      📄 Export PDF

    </button>



  </aside>



  <!-- =========================
       TREE AREA
  ========================= -->

  <main class="tree-box">

    <div id="tree"></div>

  </main>



</div>



<!-- =========================
     MODAL
========================= -->

<div id="modal" class="modal">

  <div class="modal-content">

    <h3>
      ✏ Edit Data
    </h3>

    <input
      id="editName"
      placeholder="Nama"
    >

    <input
      id="editBirth"
      type="date"
    >

    <label class="field-label">
      Tanggal Meninggal (jika sudah tiada)
    </label>

    <input
      id="editDeath"
      type="date"
    >

    <select id="editGender">

      <option value="">
        -- Jenis Kelamin --
      </option>

      <option value="male">
        ♂ Laki-laki
      </option>

      <option value="female">
        ♀ Perempuan
      </option>

    </select>

    <select id="editFather">

      <option value="">
        -- Pilih Ayah --
      </option>

    </select>

    <select id="editMother">

      <option value="">
        -- Pilih Ibu --
      </option>

    </select>

    <select id="editSpouse">

      <option value="">
        -- Pilih Pasangan --
      </option>

    </select>

    <div class="modal-actions">

      <button id="saveEditBtn">

        💾 Simpan

      </button>

      <button
        id="deleteBtn"
        class="delete"
      >

        🗑 Hapus

      </button>

      <button id="closeModalBtn">

        ❌ Batal

      </button>

    </div>

  </div>

</div>

<!-- =========================
     LOADING SCREEN
========================= -->

<div id="loading">

  <div class="loader"></div>

  <p>
    Loading Family Tree...
  </p>

</div>



<!-- =========================
     SCRIPT
========================= -->

<script
  type="module"
  src="firebase.js"
></script>

<script
  type="module"
  src="store.js"
></script>

<script
  type="module"
  src="utils.js"
></script>

<script
  type="module"
  src="auth.js"
></script>

<script
  type="module"
  src="tree.js"
></script>

<script
  type="module"
  src="modal.js"
></script>

<script
  type="module"
  src="export.js"
></script>

<script
  type="module"
  src="app.js"
></script>

<script
  type="module"
  src="theme.js"
></script>



</body>
</html>
