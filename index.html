<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pohon Silsilah</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

<h2>🌳 Poparan Opung Iren Marbun</h2>

<div class="container">

  <div class="form-box">

    <h3>Tambah Anggota</h3>

    <input id="name" placeholder="Nama">

    <input id="birth" type="date">

    <select id="father">
      <option value="">-- Pilih Ayah --</option>
    </select>

    <button id="addBtn">Tambah</button>

    <button id="saveImageBtn">
      📸 Simpan Gambar
    </button>

  </div>

  <div class="tree-box">
    <div id="tree"></div>
  </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">

  <div class="modal-content">

    <h3>Edit Data</h3>

    <input id="editName" placeholder="Nama">

    <input id="editBirth" type="date">

    <div class="modal-actions">

      <button onclick="saveEdit()">
        Simpan
      </button>

      <button onclick="deleteFromModal()" class="delete">
        Hapus
      </button>

      <button onclick="closeModal()">
        Batal
      </button>

    </div>

  </div>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="tree.js"></script>
<script type="module" src="modal.js"></script>
<script type="module" src="export.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
